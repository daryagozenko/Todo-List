name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build
        run: |
          cd TodoList
          mvn clean compile -DskipTests

  lint:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Run Checkstyle
        run: |
          cd TodoList
          mvn checkstyle:check

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run tests with coverage
        run: |
          cd TodoList
          mvn clean verify

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/todo-app:${{ github.sha }} ./TodoList
          docker tag ${{ secrets.DOCKER_USERNAME }}/todo-app:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/todo-app:latest

      - name: Save image as artifact
        run: docker save ${{ secrets.DOCKER_USERNAME }}/todo-app:${{ github.sha }} -o todo-app-image.tar

      - uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: todo-app-image.tar

  docker-push:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Push to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: ./TodoList
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/todo-app:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/todo-app:latest